[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express", "body-parser", "serverless-http"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
